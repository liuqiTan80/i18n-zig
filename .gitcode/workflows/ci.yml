name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitCode 流水线只识别仓库根目录 `.gitcode/workflows/` 下的 .yml/.yaml（GitHub Actions
# 专用目录 `.github/workflows/` 在唯一远端 gitcode.com 上从不被执行——即台账 D17 根因；
# 第 133 轮整体迁入本目录）。GitCode 虽沿用类 GitHub Actions 的 YAML 形制，但运行器语义
# 不同：默认只提供欧拉（Euler）Linux 运行器、无 ubuntu-latest/windows-latest 标签、不提供
# Windows runner；代码检出落在 `repo_workspace` 子目录，故每条 run 须先 `cd repo_workspace`；
# 各 step 是相互独立的 shell、环境变量不跨步保留，且 GitCode 不处理 `$GITHUB_PATH`——于是
# 把「装 Zig + 跑全部校验」关进同一个 run 步骤，PATH 才不会丢。Zig 无官方 setup 插件，直接
# 从 ziglang.org 官方发行位手动拉钉死的 0.17.0（不臆造第三方插件是否在场）。
jobs:
  build-test:
    name: 构建 / 测试 / 守卫（Euler Linux）
    runs-on: euleros-2.10.1
    steps:
      - name: 检出源码
        uses: checkout-action@0.0.1

      - name: 装 Zig 0.17 并跑全量门禁（fmt / build / test / LSP 长连接 / 跨目标）
        run: |
          set -e
          cd repo_workspace
          # 版本号以字面量出现在 download/0.17.0/ —— 与 check-toolchain-baseline 守卫
          # 跨侧对账同源（D73 工具链版本族：CI 装的 zig 必须与族真值同代，否则回译标定
          # 早警在 CI 上失真）。切勿改成 shell 变量插值，守卫按字面 download/<ver>/ 匹配。
          curl -sLO "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz"
          tar -xf "zig-x86_64-linux-0.17.0.tar.xz"
          export PATH="$PWD/zig-x86_64-linux-0.17.0:$PATH"
          zig version
          # 1) 格式门禁（工作区须 LF：Linux runner 不触发 autocrlf 污染）
          zig fmt --check src/ build.zig
          # 2) 构建
          zig build
          # 3) 单元与快照测试（双测试图；5 个跨文件守卫步已挂 test_step，不再重复跑）
          timeout 900 zig build test --summary all
          # 4) LSP 长连接 e2e（D128/267/268/270/272/273/274/275/276/277）：保持 stdin 打开，断言 initialize/didOpen/hover/
          #    documentSymbol/definition/references/overlay-hover/codeAction/source-fixAll/foldingRange(comment)/rename/documentHighlight/prepareRename/workspaceSymbol/signatureHelp/selectionRange/shutdown（overlay 用 contrib/packs/httpz-中文.txt）。
          #    既有 ps1 e2e 用文件重定向（启动即 EOF），只覆盖批量路径，覆盖不到真实客户端。
          timeout 30 sh tools/lsp-live-smoke.sh
          # 5) 优化档与跨目标构建（只验编译，不跑测试；产物落 /tmp，避免污染工作树）
          zig build -Doptimize=ReleaseSafe --prefix /tmp/zzc-ci-rel
          zig build -Dtarget=x86_64-windows --prefix /tmp/zzc-ci-win
          zig build -Dtarget=aarch64-macos --prefix /tmp/zzc-ci-mac
