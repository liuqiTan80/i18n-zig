<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="300" fill="#fbfaf6"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">常数 vs 变量：两种"盒子"</text>

  <!-- const box (sealed) -->
  <rect x="90" y="90" width="240" height="130" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <!-- lid taped -->
  <line x1="90" y1="120" x2="330" y2="120" stroke="#4285f4" stroke-width="2"/>
  <text x="210" y="112" text-anchor="middle" font-size="15" fill="#1a3d7c">🔒 贴上封条</text>
  <text x="210" y="175" text-anchor="middle" font-size="34" fill="#1a3d7c" font-weight="bold">10</text>
  <text x="210" y="250" text-anchor="middle" font-size="18" fill="#1a3d7c" font-weight="bold">常数 = 一次写死不能改</text>

  <!-- arrow between -->
  <text x="450" y="165" text-anchor="middle" font-size="26" fill="#999">⇄</text>

  <!-- var box (open) -->
  <rect x="570" y="90" width="240" height="130" rx="10" fill="#fef3e0" stroke="#f9a825" stroke-width="2"/>
  <line x1="570" y1="120" x2="810" y2="120" stroke="#f9a825" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="690" y="112" text-anchor="middle" font-size="15" fill="#8a5a00">🔓 盖子开着，随时换</text>
  <text x="690" y="175" text-anchor="middle" font-size="34" fill="#8a5a00" font-weight="bold">10 → 11</text>
  <text x="690" y="250" text-anchor="middle" font-size="18" fill="#8a5a00" font-weight="bold">变量 = 可以随时换新值</text>

  <text x="450" y="288" text-anchor="middle" font-size="14" fill="#666">写代码时先问自己：这个数以后要不要变？不变就用「常数」，要变才用「变量」。</text>
</svg>
